name: Update Total Stars

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate total stars
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            let page = 1;
            let total = 0;

            while (true) {
              const { data } = await github.rest.repos.listForUser({
                username: owner,
                per_page: 100,
                page
              });

              if (!data.length) break;
              for (const repo of data) total += repo.stargazers_count || 0;
              page += 1;
            }

            const fs = require("fs");
            const path = "metrics/total-stars.json";
            const payload = JSON.stringify({ total_stars: total });
            fs.writeFileSync(path, payload + "\n");

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update total stars"
          file_pattern: "metrics/total-stars.json"
